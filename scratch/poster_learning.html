<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;font-family:'Segoe UI',sans-serif;background:#070d1c;overflow:hidden;position:relative;display:flex}
body::before{content:'';position:absolute;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.2),transparent 60%);bottom:-450px;right:-350px}
.rail{width:118px;flex:0 0 118px;border-right:1px solid rgba(167,139,250,.22);display:flex;align-items:center;justify-content:center;position:relative;z-index:2;background:rgba(167,139,250,.05)}
.railtext{transform:rotate(180deg);writing-mode:vertical-rl;font-size:21px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;color:#a78bfa}
.main{flex:1;position:relative;z-index:2;display:flex;flex-direction:column;padding:78px 70px 0 62px}
h1{font-size:67px;font-weight:800;line-height:1.07;color:#fff;letter-spacing:-.02em;max-width:800px}
h1 em{font-style:normal;color:#67e8f9}
.rows{margin-top:40px;display:flex;flex-direction:column;gap:15px;max-width:760px}
.row{display:flex;gap:16px;align-items:baseline;font-size:26px;color:#b8c2dd}
.row b{color:#fff}
.n{flex:0 0 auto;font-size:22px;font-weight:800;color:#22d3ee;border:1px solid rgba(34,211,238,.4);border-radius:999px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;transform:translateY(6px)}
.shot{margin-top:52px;width:calc(100% + 70px);border-radius:20px 0 0 0;border:1px solid rgba(103,232,249,.3);border-right:none;border-bottom:none;box-shadow:0 -20px 70px rgba(0,0,0,.5)}
</style></head><body>
<div class="rail"><div class="railtext">The learning loop · new in Adapix</div></div>
<div class="main">
<h1>It studies its own results — and <em>gets smarter</em> at your business.</h1>
<div class="rows">
<div class="row"><div class="n">1</div><div><b>Watches every follow-up</b> — which hour, channel &amp; day got a reply</div></div>
<div class="row"><div class="n">2</div><div><b>Finds the pattern</b> — your customers, not an industry average</div></div>
<div class="row"><div class="n">3</div><div><b>Retimes itself</b> — follow-ups auto-shift to when they get answered</div></div>
</div>
<img class="shot" src="shot_learning.png">
</div></body></html>
